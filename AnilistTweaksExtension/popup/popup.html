<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Configuration AniList & MalSync</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1622; color: #9fadbd; width: 340px; margin: 0; padding: 15px; user-select: none; }
        h1 { color: #fff; font-size: 1.2rem; margin-top: 0; margin-bottom: 15px; text-align: center; }
        h3 { margin: 0 0 15px 0; color: #3db4f2; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; text-align: center; }
        
        /* Navigation */
        .menu-view { display: none; }
        .menu-view.active { display: block; }
        .nav-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background: #151f2e; color: #fff; border: 1px solid #3db4f2; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; font-size: 1.1rem; transition: background 0.2s; }
        .nav-btn:hover { background: #3db4f2; color: #11161d; }
        .back-btn { background: transparent; color: #9fadbd; border: none; font-size: 0.9rem; cursor: pointer; margin-bottom: 15px; display: inline-block; padding: 0; text-decoration: underline; }
        .back-btn:hover { color: #fff; }

        /* AniList Styles */
        label { display: block; margin-top: 10px; font-size: 0.9rem; font-weight: bold; color: #fff; }
        input[type="text"] { box-sizing: border-box; width: 100%; padding: 6px; margin-top: 4px; border-radius: 4px; border: 1px solid #151f2e; background: #151f2e; color: #fff; font-size: 0.9rem; }
        input[type="number"] { box-sizing: border-box; width: 100%; padding: 6px; margin-top: 4px; border-radius: 4px; border: 1px solid #151f2e; background: #151f2e; color: #fff; font-size: 0.9rem; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .list-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .list-row input.list-name { flex: 1; margin-top: 0; }
        .list-row input[type="color"] { width: 38px; height: 32px; padding: 0; border: none; border-radius: 4px; background: transparent; cursor: pointer; }
        .remove-btn { background: transparent; color: #e13333; border: none; font-size: 1.2rem; cursor: pointer; padding: 0 4px; width: auto; margin-top: 0; }
        .remove-btn:hover { background: rgba(225, 51, 51, 0.1); }
        .add-btn { background: rgba(61, 180, 242, 0.1); color: var(--color-blue, #3db4f2); margin-top: 8px; border: 1px dashed #3db4f2; width: 100%; padding: 8px; border-radius: 4px; cursor: pointer; }
        .save-btn { margin-top: 15px; padding: 8px; background: #3ecf8e; color: #111; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: background 0.2s; }
        #status { margin-top: 10px; text-align: center; font-weight: bold; font-size: 0.9rem; min-height: 18px; }

        /* MalSync Styles */
        .ms-row { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #ddd; }
        .ms-row label { cursor: pointer; display: flex; align-items: center; gap: 8px; }
        input[type="checkbox"] { cursor: pointer; accent-color: #3db4f2; }
        .ms-pill-wrapper { display: flex; align-items: center; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; padding-right: 4px; overflow: hidden; transition: border-color 0.2s; }
        .ms-pill-wrapper:focus-within { border-color: #3db4f2; }
        .ms-pill-input { width: 30px; background: transparent; color: #3db4f2; border: none; padding: 6px 0 6px 8px; text-align: center; font-weight: bold; outline: none; font-size: 13px; }
        .ms-pill-input::-webkit-outer-spin-button, .ms-pill-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .ms-pill-input[type=number] { -moz-appearance: textfield; }
        .ms-pill-label { color: #666; font-size: 11px; padding: 0 6px 0 2px; font-weight: bold; }
        .ms-arrows-spin { display: flex; flex-direction: column; justify-content: center; gap: 2px; }
        .ms-arrow-btn { background: transparent; border: none; color: #555; cursor: pointer; font-size: 7px; padding: 1px 3px; line-height: 1; border-radius: 2px; transition: all 0.1s; }
        .ms-arrow-btn:hover { background: rgba(61, 180, 242, 0.2); color: #3db4f2; }
        .ms-arrow-btn:active { transform: scale(0.9); }
        hr { border: 0; border-top: 1px solid rgba(255,255,255,0.05); margin: 12px 0; }
    </style>
</head>
<body>

    <!-- MENU PRINCIPAL -->
    <div id="view-main" class="menu-view active">
        <h1>⚙️ Extension Hub</h1>
        <button id="btn-go-anilist" class="nav-btn">AniList Tweaks</button>
        <button id="btn-go-malsync" class="nav-btn">MalSync Auto</button>
    </div>

    <!-- MENU ANILIST -->
    <div id="view-anilist" class="menu-view">
        <button class="back-btn" data-target="view-main">← Retour</button>
        <h3>AniList Tweaks</h3>
        <label>URL Supabase</label><input type="text" id="supabaseUrl">
        <label>Clé Anonyme Supabase</label><input type="text" id="supabaseKey">
        <label>Nom de la table</label><input type="text" id="tableName" placeholder="anime_history">
        <label>Pseudo AniList</label><input type="text" id="anilistUsername">
        <label>Liste Notifications</label><input type="text" id="notifList" placeholder="Not Yet">
        <label>Spinner Duration (seconds)</label><input type="number" id="spinnerDuration" min="1" value="3">
        
        <label>Configuration des Listes</label>
        <div id="listsContainer"></div>
        <button id="addList" class="add-btn">➕ Ajouter une liste</button>
        
        <button id="saveAnilist" class="save-btn">Sauvegarder</button>
        <div id="status"></div>
    </div>

    <!-- MENU MALSYNC -->
    <div id="view-malsync" class="menu-view">
        <button class="back-btn" data-target="view-main">← Retour</button>
        <h3>MalSync Auto</h3>
        
        <div class="ms-row"><label><input type="checkbox" id="start"> Start Watching</label></div>
        <div class="ms-row"><label><input type="checkbox" id="finish"> Finish Watching</label></div>
        <div class="ms-row"><label><input type="checkbox" id="rewatch_start"> Start Rewatching</label></div>
        <div class="ms-row"><label><input type="checkbox" id="rewatch_finish"> Finish Rewatching</label></div>
        <hr>
        <div class="ms-row">
            <span>Note auto (Finish)</span>
            <div class="ms-pill-wrapper">
                <input type="number" class="ms-pill-input" id="score" min="1" max="10">
                <span class="ms-pill-label">/10</span>
                <div class="ms-arrows-spin">
                    <button class="ms-arrow-btn" data-target="score" data-dir="up">▲</button>
                    <button class="ms-arrow-btn" data-target="score" data-dir="down">▼</button>
                </div>
            </div>
        </div>
        <div class="ms-row">
            <span>Délai avant clic</span>
            <div class="ms-pill-wrapper">
                <input type="number" class="ms-pill-input" id="delay" min="0">
                <span class="ms-pill-label">sec</span>
                <div class="ms-arrows-spin">
                    <button class="ms-arrow-btn" data-target="delay" data-dir="up">▲</button>
                    <button class="ms-arrow-btn" data-target="delay" data-dir="down">▼</button>
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
